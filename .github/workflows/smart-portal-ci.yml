name: Smart Portal CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/placas-smart-portal-premium]
jobs:
  validation:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate types
        run: npm run typecheck
      - name: Validate lint
        run: npm run lint
      - name: Build
        run: npm run build
